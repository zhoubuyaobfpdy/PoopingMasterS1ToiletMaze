<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏆 厕所迷宫 · 排行榜</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #1a1a2e;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  color: #eee;
  padding: 30px 15px;
}

#container {
  width: 650px;
  max-width: 95vw;
}

/* 标题 */

h1 {
  text-align: center;
  font-size: 30px;
  color: #e94560;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #888;
  margin-bottom: 25px;
}

/* 统计 */

.stats-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 18px;
  font-size: 13px;
  color: #888;
}

.stats-row span {
  color: #aaa;
}

.stats-row b {
  color: #e94560;
}

/* 按钮 */

.refresh-btn,
.clear-btn {
  display: inline-block;
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
}

.refresh-btn {
  background: #0f3460;
  color: #eee;
  border: 1px solid #1e3050;
}

.refresh-btn:hover {
  background: #1a4070;
}

.clear-btn {
  background: transparent;
  color: #777;
  border: 1px solid #333;
  margin-left: 8px;
}

.clear-btn:hover {
  color: #e94560;
  border-color: #e94560;
}

.button-row {
  text-align: center;
  margin-bottom: 20px;
}

/* 加载 */

#loading {
  text-align: center;
  font-size: 18px;
  color: #aaa;
  padding: 60px 0;
}

/* 表格 */

#leaderboard-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
  background: #16213e;
  border-radius: 8px;
  overflow: hidden;
}

#leaderboard-table th {
  background: #0f3460;
  color: #e94560;
  padding: 14px 10px;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

#leaderboard-table td {
  padding: 13px 10px;
  border-bottom: 1px solid #1e3050;
}

#leaderboard-table tbody tr:hover td {
  background: rgba(233, 69, 96, 0.08);
}

/* 前三名 */

.rank-1 td:first-child {
  color: #ffd700;
  font-size: 22px;
}

.rank-2 td:first-child {
  color: #c0c0c0;
  font-size: 20px;
}

.rank-3 td:first-child {
  color: #cd7f32;
  font-size: 20px;
}

/* 玩家自己 */

.you td {
  background: rgba(233, 69, 96, 0.12) !important;
}

.you td:first-child {
  border-left: 3px solid #e94560;
}

/* 空排行榜 */

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #666;
}

.empty-state .emoji {
  font-size: 50px;
  margin-bottom: 10px;
}

.empty-state p {
  font-size: 16px;
  line-height: 1.8;
}

/* 返回 */

.back-link {
  display: block;
  text-align: center;
  margin-top: 25px;
  color: #5dade2;
  font-size: 16px;
  text-decoration: underline;
  cursor: pointer;
}

.back-link:hover {
  color: #85c1e9;
}

/* 手机 */

@media (max-width: 600px) {

  body {
    padding: 20px 10px;
  }

  h1 {
    font-size: 24px;
  }

  .stats-row {
    gap: 12px;
    font-size: 12px;
  }

  #leaderboard-table {
    font-size: 14px;
  }

  #leaderboard-table th {
    font-size: 12px;
    padding: 10px 5px;
  }

  #leaderboard-table td {
    padding: 10px 5px;
  }
}
</style>
</head>

<body>

<div id="container">

  <h1>🏆 厕所迷宫 · 排行榜</h1>

  <p class="subtitle">
    排名规则：成功次数少 → ⭐星星多 → 先上榜
  </p>

  <!-- 统计 -->

  <div class="stats-row">

    <span>
      总玩家：
      <b id="stat-players">0</b>
    </span>

    <span>
      总挑战：
      <b id="stat-attempts">0</b>
    </span>

    <span>
      总通关：
      <b id="stat-success">0</b>
    </span>

  </div>

  <!-- 按钮 -->

  <div class="button-row">

    <button
      class="refresh-btn"
      onclick="loadLeaderboard()">
      🔄 刷新
    </button>

    <button
      class="clear-btn"
      onclick="clearLeaderboard()">
      清空排行榜
    </button>

  </div>

  <!-- 加载 -->

  <div id="loading">
    加载中...
  </div>

  <!-- 排行榜 -->

  <table
    id="leaderboard-table"
    style="display:none;">

    <thead>

      <tr>

        <th style="width:55px;">
          #
        </th>

        <th>
          玩家
        </th>

        <th style="width:90px;">
          通关次数
        </th>

        <th style="width:110px;">
          ⭐ 星星
        </th>

        <th style="width:90px;">
          总尝试
        </th>

      </tr>

    </thead>

    <tbody id="lb-body">
    </tbody>

  </table>

  <!-- 返回游戏 -->

  <span
    class="back-link"
    onclick="goBack()">

    ← 返回游戏

  </span>

</div>


<script>

/*
========================================================
  厕所迷宫排行榜
  GitHub Pages 版本
========================================================

  数据储存在浏览器 localStorage。

  不需要：
  ❌ server
  ❌ API
  ❌ Python
  ❌ Node.js
  ❌ 数据库

========================================================
*/


/* =====================================================
   1. 数据储存名称
===================================================== */

const STORAGE_KEY = "poopingMasterLeaderboard";


/* =====================================================
   2. 获取玩家名字
===================================================== */

function getPlayerName() {

  try {

    const params =
      new URLSearchParams(window.location.search);

    return params.get("name") || "";

  } catch (error) {

    return "";

  }

}


/* =====================================================
   3. 防止 HTML 注入
===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================================
   4. 获取排行榜数据
===================================================== */

function getLeaderboard() {

  try {

    const data =
      localStorage.getItem(STORAGE_KEY);

    if (!data) {
      return [];
    }

    const leaderboard =
      JSON.parse(data);

    if (!Array.isArray(leaderboard)) {
      return [];
    }

    return leaderboard;

  } catch (error) {

    console.error(
      "读取排行榜失败：",
      error
    );

    return [];

  }

}


/* =====================================================
   5. 保存排行榜
===================================================== */

function saveLeaderboard(data) {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  } catch (error) {

    console.error(
      "保存排行榜失败：",
      error
    );

  }

}


/* =====================================================
   6. 添加成绩
=====================================================

   游戏结束后可以调用：

   addScore("Nancy", true, 3);

   参数：

   name    = 玩家名字
   success = 是否成功
   stars   = 星星数量

===================================================== */

function addScore(
  name,
  success,
  stars
) {

  name =
    String(name || "").trim();

  if (!name) {
    return;
  }

  stars =
    Number(stars) || 0;

  stars =
    Math.max(
      0,
      Math.min(3, stars)
    );

  const leaderboard =
    getLeaderboard();


  /* 找玩家 */

  let player =
    leaderboard.find(
      function(item) {

        return item.name === name;

      }
    );


  /* 如果第一次玩 */

  if (!player) {

    player = {

      name: name,

      totalAttempts: 0,

      successAttempts: 0,

      stars: 0,

      firstPlayed:
        Date.now()

    };

    leaderboard.push(player);

  }


  /* 增加尝试次数 */

  player.totalAttempts++;


  /* 如果成功 */

  if (success) {

    player.successAttempts++;

    /*
      这里采用最高星星数
    */

    player.stars =
      Math.max(
        player.stars,
        stars
      );

  }


  /* 排序 */

  sortLeaderboard(leaderboard);


  /* 保存 */

  saveLeaderboard(leaderboard);

}


/* =====================================================
   7. 排序规则
=====================================================

   ① 成功次数少的人优先
   ② 星星多的人优先
   ③ 更早上榜的人优先

===================================================== */

function sortLeaderboard(data) {

  data.sort(
    function(a, b) {

      /* 成功次数 */

      if (
        a.successAttempts !==
        b.successAttempts
      ) {

        return (
          a.successAttempts -
          b.successAttempts
        );

      }


      /* 星星 */

      if (
        a.stars !==
        b.stars
      ) {

        return (
          b.stars -
          a.stars
        );

      }


      /* 时间 */

      return (
        a.firstPlayed -
        b.firstPlayed
      );

    }
  );

}


/* =====================================================
   8. 显示排行榜
===================================================== */

function loadLeaderboard() {

  const leaderboard =
    getLeaderboard();

  renderLeaderboard(
    leaderboard
  );

}


/* =====================================================
   9. 渲染排行榜
===================================================== */

function renderLeaderboard(
  leaderboard
) {

  const loading =
    document.getElementById(
      "loading"
    );

  const table =
    document.getElementById(
      "leaderboard-table"
    );

  const body =
    document.getElementById(
      "lb-body"
    );

  const myName =
    getPlayerName();


  /* 排序 */

  sortLeaderboard(
    leaderboard
  );


  /* 没有人 */

  if (
    leaderboard.length === 0
  ) {

    table.style.display =
      "none";

    loading.style.display =
      "block";

    loading.innerHTML =

      '<div class="empty-state">' +

      '<div class="emoji">🏜️</div>' +

      '<p>还没有人上榜！</p>' +

      '<p>快去玩游戏，抢占第一名吧！</p>' +

      '</div>';

    updateStats([]);

    return;

  }


  /* 有数据 */

  loading.style.display =
    "none";

  table.style.display =
    "table";


  /* 统计 */

  updateStats(
    leaderboard
  );


  /* 生成表格 */

  let html = "";


  for (
    let i = 0;
    i < leaderboard.length;
    i++
  ) {

    const player =
      leaderboard[i];


    /* 是否是自己 */

    const isMe =
      myName &&
      player.name === myName;


    /* class */

    let className = "";


    if (i === 0) {

      className =
        "rank-1";

    } else if (i === 1) {

      className =
        "rank-2";

    } else if (i === 2) {

      className =
        "rank-3";

    }


    if (isMe) {

      className +=
        " you";

    }


    /* 名次 */

    let rank;

    if (i === 0) {

      rank = "🥇";

    } else if (i === 1) {

      rank = "🥈";

    } else if (i === 2) {

      rank = "🥉";

    } else {

      rank =
        i + 1;

    }


    /* 星星 */

    const stars =
      Number(player.stars) || 0;

    let starString =
      "☆☆☆";


    if (stars === 1) {

      starString =
        "⭐☆☆";

    } else if (stars === 2) {

      starString =
        "⭐⭐☆";

    } else if (stars >= 3) {

      starString =
        "⭐⭐⭐";

    }


    /* 玩家名字 */

    const safeName =
      escapeHtml(
        player.name
      );


    html +=

      '<tr class="' +
      className +
      '">' +

      '<td style="text-align:center;">' +
      rank +
      '</td>' +

      '<td>' +
      safeName;


    /* 自己 */

    if (isMe) {

      html +=

        ' <span ' +
        'style="' +
        'color:#e94560;' +
        'font-size:12px;">' +
        '(你)' +
        '</span>';

    }


    html +=

      '</td>' +

      '<td style="' +
      'text-align:center;' +
      'font-weight:bold;">' +

      (
        player.successAttempts ||
        0
      ) +

      '</td>' +

      '<td style="' +
      'text-align:center;">' +

      starString +

      '</td>' +

      '<td style="' +
      'text-align:center;' +
      'color:#888;">' +

      (
        player.totalAttempts ||
        0
      ) +

      '</td>' +

      '</tr>';

  }


  body.innerHTML =
    html;

}


/* =====================================================
   10. 更新统计
===================================================== */

function updateStats(
  leaderboard
) {

  let totalAttempts = 0;

  let totalSuccess = 0;


  for (
    const player of leaderboard
  ) {

    totalAttempts +=
      Number(
        player.totalAttempts
      ) || 0;

    totalSuccess +=
      Number(
        player.successAttempts
      ) || 0;

  }


  document.getElementById(
    "stat-players"
  ).textContent =
    leaderboard.length;


  document.getElementById(
    "stat-attempts"
  ).textContent =
    totalAttempts;


  document.getElementById(
    "stat-success"
  ).textContent =
    totalSuccess;

}


/* =====================================================
   11. 清空排行榜
===================================================== */

function clearLeaderboard() {

  const confirmClear =
    confirm(
      "确定要清空整个排行榜吗？"
    );


  if (!confirmClear) {
    return;
  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  loadLeaderboard();

}


/* =====================================================
   12. 返回游戏
===================================================== */

function goBack() {

  window.location.href =
    "/PoopingMasterS1ToiletMaze/";

}


/* =====================================================
   13. 从 URL 自动添加成绩
=====================================================

   例如：

   leaderboard.html?
   name=Nancy&
   success=1&
   stars=3

===================================================== */

function processScoreFromURL() {

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const name =
      params.get("name");


    const success =
      params.get("success");


    const stars =
      params.get("stars");


    /*
      必须至少有名字
    */

    if (!name) {
      return;
    }


    /*
      防止刷新页面重复提交

      使用 sessionStorage
      保证同一个页面刷新不会再次提交
    */

    const submitKey =
      "submitted_" +
      name +
      "_" +
      success +
      "_" +
      stars;


    if (
      sessionStorage.getItem(
        submitKey
      )
    ) {

      return;

    }


    /* 添加成绩 */

    addScore(
      name,
      success === "1" ||
      success === "true",
      stars
    );


    /* 标记已经提交 */

    sessionStorage.setItem(
      submitKey,
      "1"
    );


  } catch (error) {

    console.error(
      "处理成绩失败：",
      error
    );

  }

}


/* =====================================================
   14. 初始化
===================================================== */

processScoreFromURL();

loadLeaderboard();

</script>

</body>
</html>
